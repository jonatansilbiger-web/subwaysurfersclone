<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Runner</title>
<style>
html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#ui{position:absolute;top:10px;left:10px;color:white;font-weight:bold;font-size:20px;text-shadow:0 2px 4px #000}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:white;font-size:40px;text-shadow:0 2px 6px #000}
</style>
</head>
<body>
<div id="ui"></div>
<div id="msg">Press SPACE to Start</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;

const lanes=[-120,0,120];
let started=false,over=false,score=0,speed=8;
const p={lane:1,x:0,y:0,vy:0};
const obs=[];

function spawn(){
 const safe=Math.floor(Math.random()*3);
 for(let l=0;l<3;l++){
   if(l!==safe && Math.random()<0.7){
      obs.push({lane:l,z:1200});
   }
 }
}

for(let i=0;i<10;i++){spawn();obs.forEach(o=>o.z+=i*250);}

addEventListener("keydown",e=>{
 if(!started&&e.code==="Space"){started=true;msg.style.display="none";return;}
 if(over&&e.code==="Space") location.reload();
 if(e.code==="ArrowLeft"||e.key==="a") p.lane=Math.max(0,p.lane-1);
 if(e.code==="ArrowRight"||e.key==="d") p.lane=Math.min(2,p.lane+1);
 if(e.code==="Space"&&p.y===0){p.vy=16;}
});

function loop(){
 requestAnimationFrame(loop);

 if(started&&!over){
   score++;
   speed=Math.min(18,8+score/1000);

   p.x += (lanes[p.lane]-p.x)*0.2;

   if(p.y>0||p.vy>0){
      p.y += p.vy;
      p.vy -= 0.8;
      if(p.y<0){p.y=0;p.vy=0;}
   }

   for(const o of obs) o.z-=speed;

   if(obs.length && obs[0].z<-100){
      obs.shift();
      if(Math.random()<0.7) spawn();
   }

   for(const o of obs){
      if(Math.abs(o.z-120)<40 && Math.abs(lanes[o.lane]-p.x)<40 && p.y<60){
         over=true;
         msg.innerHTML="Game Over<br>Score: "+score+"<br>Press SPACE";
         msg.style.display="flex";
      }
   }
 }

 x.clearRect(0,0,c.width,c.height);

 x.fillStyle="#666";
 x.fillRect(c.width/2-220,0,440,c.height);

 x.strokeStyle="#fff";
 x.lineWidth=4;
 x.setLineDash([20,20]);
 x.beginPath();
 x.moveTo(c.width/2-70,0);x.lineTo(c.width/2-70,c.height);
 x.moveTo(c.width/2+70,0);x.lineTo(c.width/2+70,c.height);
 x.stroke();
 x.setLineDash([]);

 for(const o of obs){
   const s=Math.max(0.2,1-o.z/1400);
   const ox=c.width/2+lanes[o.lane]*s;
   const oy=c.height-o.z*0.45;
   x.fillStyle="#d32f2f";
   x.fillRect(ox-30*s,oy-40*s,60*s,80*s);
 }

 x.fillStyle="rgba(0,0,0,.2)";
 x.beginPath();
 x.ellipse(c.width/2+p.x,c.height-120,35,12,0,0,7);
 x.fill();

 x.save();
 x.translate(c.width/2+p.x,c.height-140-p.y);
 x.fillStyle="#ffcc80";
 x.beginPath();x.arc(0,-35,15,0,7);x.fill();
 x.fillStyle="#1976d2";
 x.fillRect(-12,-20,24,35);
 x.fillRect(-10,15,8,25);
 x.fillRect(2,15,8,25);
 x.restore();

 ui.textContent="Score: "+score;
}
loop();
</script>
</body>
</html>
